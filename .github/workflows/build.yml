name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: argus
  APP_DISPLAY_NAME: Argus Agent
  WEBSITE_URL: https://argus-agent.anyscapelabs.com
  SUPPORT_EMAIL: hello@anyscapelabs.com
  WAILS_VERSION: v3.0.0-alpha.72
  GO_VERSION: '1.26.x'
  NODE_VERSION: '24'

jobs:
  macos:
    name: macOS (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_LDFLAGS: >-
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGoogleOAuthClientID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGoogleOAuthClientSecret=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildArgusGoogleClientID=${{ secrets.ARGUS_GOOGLE_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildArgusGoogleClientSecret=${{ secrets.ARGUS_GOOGLE_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGithubClientID=${{ secrets.ARGUS_GITHUB_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGithubClientSecret=${{ secrets.ARGUS_GITHUB_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildPublicURL=${{ vars.ARGUS_PUBLIC_URL }}
      VITE_ANYSCAPE_GATEWAY_URL: ${{ vars.ANYSCAPE_GATEWAY_URL }}
      VITE_ANYSCAPE_CONSOLE_URL: ${{ vars.ANYSCAPE_CONSOLE_URL }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
            label: intel-x64
          - runner: macos-14
            arch: arm64
            label: apple-silicon-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash ./build/stamp-version.sh "${{ github.ref_name }}"

      - name: Build .app bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: task darwin:package ARCH=${ARCH}

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/argus-signing.keychain-db"
          password="$(uuidgen)"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign the .app bundle
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' }}
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="bin/${APP_NAME}.app"
          codesign --force --deep --timestamp --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        env:
          ARCH: ${{ matrix.arch }}
        continue-on-error: true
        run: task darwin:create:dmg ARCH=${ARCH}

      - name: Sign the DMG
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' }}
        shell: bash
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in bin/*.dmg; do
            codesign --force --timestamp --sign "$IDENTITY" "$f"
          done

      - name: Notarize and staple
        if: ${{ env.MACOS_NOTARY_APPLE_ID != '' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/${APP_NAME}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "bin/${APP_NAME}.app" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "bin/${APP_NAME}.app"
          shopt -s nullglob
          for f in bin/*.dmg; do
            xcrun notarytool submit "$f" \
              --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" --wait
            xcrun stapler staple "$f"
          done

      - name: Collect artifacts
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f "bin/${APP_NAME}" ]; then
            cp "bin/${APP_NAME}" "dist/${APP_NAME}-macos-${LABEL}"
          fi
          if [ -d "bin/${APP_NAME}.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "bin/${APP_NAME}.app" "dist/${APP_NAME}-macos-${LABEL}.app.zip"
          fi
          shopt -s nullglob
          for f in bin/*.dmg; do
            cp "$f" "dist/${APP_NAME}-macos-${LABEL}.dmg"
          done
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-agent-macos-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_LDFLAGS: >-
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGoogleOAuthClientID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGoogleOAuthClientSecret=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildArgusGoogleClientID=${{ secrets.ARGUS_GOOGLE_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildArgusGoogleClientSecret=${{ secrets.ARGUS_GOOGLE_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGithubClientID=${{ secrets.ARGUS_GITHUB_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGithubClientSecret=${{ secrets.ARGUS_GITHUB_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildPublicURL=${{ vars.ARGUS_PUBLIC_URL }}
      VITE_ANYSCAPE_GATEWAY_URL: ${{ vars.ANYSCAPE_GATEWAY_URL }}
      VITE_ANYSCAPE_CONSOLE_URL: ${{ vars.ANYSCAPE_CONSOLE_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            label: x86_64-amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            label: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config file wget curl \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            rpm desktop-file-utils
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nfpm
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v nfpm >/dev/null 2>&1; then
            echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
            sudo apt-get update
            if ! sudo apt-get install -y nfpm; then
              go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
            fi
          fi

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash ./build/stamp-version.sh "${{ github.ref_name }}"

      - name: Build binary
        env:
          ARCH: ${{ matrix.arch }}
        run: task linux:build ARCH=${ARCH}

      - name: Create AppImage
        env:
          ARCH: ${{ matrix.arch }}
        continue-on-error: true
        run: task linux:create:appimage ARCH=${ARCH}

      - name: Create DEB package
        env:
          ARCH: ${{ matrix.arch }}
        continue-on-error: true
        run: task linux:create:deb ARCH=${ARCH}

      - name: Create RPM package
        env:
          ARCH: ${{ matrix.arch }}
        continue-on-error: true
        run: task linux:create:rpm ARCH=${ARCH}

      - name: Create Arch Linux package
        env:
          ARCH: ${{ matrix.arch }}
        continue-on-error: true
        run: task linux:create:aur ARCH=${ARCH}

      - name: Collect artifacts
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -f "bin/${APP_NAME}" ]; then
            cp "bin/${APP_NAME}" "dist/${APP_NAME}-linux-${LABEL}"
          fi
          shopt -s nullglob
          # Copy and normalize known package outputs from bin/
          for f in bin/*.AppImage; do cp "$f" "dist/${APP_NAME}-linux-${LABEL}.AppImage"; done
          for f in bin/*.deb; do cp "$f" "dist/${APP_NAME}-linux-${LABEL}.deb"; done
          for f in bin/*.rpm; do cp "$f" "dist/${APP_NAME}-linux-${LABEL}.rpm"; done
          # Arch packages may be .pkg.tar.zst/.pkg.tar.xz/.pkg.tar.gz
          for f in bin/*.pkg.tar.* bin/*.pkg.tar; do
            cp "$f" "dist/${APP_NAME}-linux-${LABEL}-$(basename "$f" | sed "s/^${APP_NAME}//; s/^-//")"
          done
          # Fallback: include any other archives/binaries produced
          for f in bin/*.tar.gz bin/*.tar.xz bin/*.zip; do
            [ -f "$f" ] && cp "$f" "dist/" || true
          done
          echo "== dist =="
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-agent-linux-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.label }})
    runs-on: windows-latest
    env:
      BUILD_LDFLAGS: >-
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGoogleOAuthClientID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGoogleOAuthClientSecret=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildArgusGoogleClientID=${{ secrets.ARGUS_GOOGLE_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildArgusGoogleClientSecret=${{ secrets.ARGUS_GOOGLE_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGithubClientID=${{ secrets.ARGUS_GITHUB_CLIENT_ID }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildGithubClientSecret=${{ secrets.ARGUS_GITHUB_CLIENT_SECRET }}
        -X github.com/anyscapelabs/argus/Services/Shared.BuildPublicURL=${{ vars.ARGUS_PUBLIC_URL }}
      VITE_ANYSCAPE_GATEWAY_URL: ${{ vars.ANYSCAPE_GATEWAY_URL }}
      VITE_ANYSCAPE_CONSOLE_URL: ${{ vars.ANYSCAPE_CONSOLE_URL }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            label: x64-amd64
          - arch: arm64
            label: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y

      - name: Install Wails v3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash ./build/stamp-version.sh "${{ github.ref_name }}"

      - name: Build binary
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: task windows:build ARCH=${ARCH}

      - name: Import the Authenticode certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'argus-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          "SIGN_CERT_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign the executable
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK' }
          & $signtool.FullName sign /fd SHA256 /f $env:SIGN_CERT_PATH /p $env:CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 "bin\${env:APP_NAME}.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

      - name: Create NSIS installer
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        continue-on-error: true
        run: task windows:create:nsis:installer ARCH=${ARCH}

      - name: Sign the installer
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK' }
          Get-ChildItem bin\*installer*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /f $env:SIGN_CERT_PATH /p $env:CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          }

      - name: Remove the signing certificate
        if: always() && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: Remove-Item -Force $env:SIGN_CERT_PATH -ErrorAction SilentlyContinue

      - name: Collect artifacts
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          if [ -f "bin/${APP_NAME}.exe" ]; then
            cp "bin/${APP_NAME}.exe" "dist/${APP_NAME}-windows-${LABEL}.exe"
          fi
          # NSIS installers and other outputs
          for f in bin/*installer*.exe; do
            [ -f "$f" ] && cp "$f" "dist/${APP_NAME}-windows-${LABEL}-installer.exe" || true
          done
          for f in build/windows/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" "dist/${APP_NAME}-windows-${LABEL}-installer.exe" || true
          done
          for f in bin/*.msix; do
            [ -f "$f" ] && cp "$f" "dist/${APP_NAME}-windows-${LABEL}.msix" || true
          done
          for f in bin/*.zip; do
            [ -f "$f" ] && cp "$f" "dist/" || true
          done
          echo "== dist =="
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argus-agent-windows-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -R release-assets

      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Argus Agent desktop builds.
            - Description: Your AI Pro Active Teammate
            - Company: Anyscape Labs PLC
            - Support: hello@anyscapelabs.com
            - Website: https://argus-agent.anyscapelabs.com

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: [macos, linux, windows]
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "## Argus Agent build"
            echo ""
            echo "- **Product:** Argus Agent"
            echo "- **Description:** Your AI Pro Active Teammate"
            echo "- **Company:** Anyscape Labs PLC"
            echo "- **Support:** ${SUPPORT_EMAIL}"
            echo "- **Website:** ${WEBSITE_URL}"
            echo "- **Ref:** \`${{ github.ref_name }}\`"
            echo ""
            echo "### Targets"
            echo "- macOS: Intel (x64) and Apple Silicon (arm64) — .app bundle zip, DMG (when available), raw binary"
            echo "- Linux: x86_64/amd64 and arm64 — AppImage, .deb, .rpm, Arch package (when available), raw binary"
            echo "- Windows: x64/amd64 and arm64 — .exe binary, NSIS installer (when available)"
          } >> "$GITHUB_STEP_SUMMARY"
